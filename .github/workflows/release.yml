name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # build-only rehearsal; publishes nothing

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/obeos-component-ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must be on main and match the package version
        run: |
          python - <<'PY'
          import os, subprocess, sys, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          ref = os.environ["GITHUB_REF_NAME"]
          if os.environ["GITHUB_REF"].startswith("refs/tags/"):
              if ref != "v" + version:
                  sys.exit(f"tag {ref} does not match version {version}")
              subprocess.run(["git", "fetch", "origin", "main"], check=True)
              if subprocess.run(["git", "merge-base", "--is-ancestor", "HEAD", "origin/main"]).returncode:
                  sys.exit("tagged commit is not on main")
          if not os.path.exists(f"docs/releases/v{version}.md"):
              sys.exit(f"docs/releases/v{version}.md is missing")
          print("version", version)
          PY
      - name: Build wheel and sdist
        run: |
          python -m pip install -U pip build twine
          python -m build
          python -m twine check dist/*
      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd "$(mktemp -d)"
          /tmp/smoke/bin/earthglass --help > /dev/null
          /tmp/smoke/bin/python -c "import earthglass, pathlib; assert 'site-packages' in pathlib.Path(earthglass.__file__).parts"
      - name: The bundled city index ships in the wheel
        run: |
          cd "$(mktemp -d)"
          /tmp/smoke/bin/python -c "import earthglass, pathlib; assert (pathlib.Path(earthglass.__file__).parent / 'spatial/data/cities15000.json.gz').is_file()"
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: docs/releases/${{ github.ref_name }}.md
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
