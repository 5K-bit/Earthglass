server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Same origin for the page and the API, so no CORS settings are needed.
    location ~ ^/(api|weather|health) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
