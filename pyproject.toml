[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "earthglass"
version = "0.4.0"
description = "EarthGlass: renderer-agnostic geospatial layer engine for OBEOS Earth and other clients."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "jinja2>=3.1.0",
  "httpx>=0.27.0",
  "numpy>=1.26.0",
  "sgp4==2.25",
  "gtfs-realtime-bindings==2.2.0",
  "tzdata>=2025.2",
  "websockets==16.0",
]

[project.optional-dependencies]
maps = ["pyshp>=2.3,<3", "shapely>=2,<3"]
weather = ["numpy>=1.26", "pillow>=10", "xarray>=2024.1", "cfgrib>=0.9.10", "eccodes>=1.6"]
dev = [
  "pytest>=8.4.0",
  "httpx>=0.27.0",
]

[project.scripts]
earthglass = "earthglass.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["earthglass"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
